# Runs on every pull request and every push to main: install, lint, test, build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Server tests start an in-memory MongoDB, so no database service is needed here.
      - run: npm test
      - run: npm run build
